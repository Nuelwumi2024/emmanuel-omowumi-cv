<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Emmanuel Omowumi - Data Analyst, Sales Department at Learn Africa Plc. SQL, Python, Power BI, Tableau, dbt. Curriculum vitae.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="0.6" stop-color="#12376b"/>
      <stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb2ff"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect x="60" y="52" width="56" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="84" font-size="14" font-weight="600" letter-spacing="3" fill="#7fb2ff">CURRICULUM VITAE</text>
    <text x="60" y="144" font-size="56" font-weight="700">Emmanuel Omowumi</text>
    <text x="60" y="188" font-size="24" fill-opacity="0.95">Data Analyst, Sales &#183; Learn Africa Plc</text>
    <text x="60" y="222" font-size="17" fill="#bcd6ff">Fintech analytics &#183; Reliable data pipelines &#183; Data storytelling</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a1a33">
    <rect x="60" y="248" width="74" height="30" rx="15" fill="#ffffff"/><text x="97" y="268" text-anchor="middle">Python</text>
    <rect x="144" y="248" width="60" height="30" rx="15" fill="#ffffff"/><text x="174" y="268" text-anchor="middle">SQL</text>
    <rect x="214" y="248" width="86" height="30" rx="15" fill="#ffffff"/><text x="257" y="268" text-anchor="middle">Power BI</text>
    <rect x="310" y="248" width="80" height="30" rx="15" fill="#ffffff"/><text x="350" y="268" text-anchor="middle">Tableau</text>
    <rect x="400" y="248" width="60" height="30" rx="15" fill="#ffffff"/><text x="430" y="268" text-anchor="middle">dbt</text>
    <rect x="470" y="248" width="80" height="30" rx="15" fill="#ffffff"/><text x="510" y="268" text-anchor="middle">Airflow</text>
  </g>

  <!-- stat tiles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <g transform="translate(780,70)">
      <rect width="170" height="84" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="85" y="42" font-size="34" font-weight="700">5</text>
      <text x="85" y="66" font-size="13" fill="#bcd6ff">Fintech projects</text>
    </g>
    <g transform="translate(970,70)">
      <rect width="170" height="84" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="85" y="42" font-size="34" font-weight="700">117k</text>
      <text x="85" y="66" font-size="13" fill="#bcd6ff">Records processed</text>
    </g>
    <g transform="translate(780,170)">
      <rect width="170" height="84" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="85" y="42" font-size="34" font-weight="700">20/20</text>
      <text x="85" y="66" font-size="13" fill="#bcd6ff">dbt build checks pass</text>
    </g>
    <g transform="translate(970,170)">
      <rect width="170" height="84" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="85" y="42" font-size="34" font-weight="700">M.Sc.</text>
      <text x="85" y="66" font-size="13" fill="#bcd6ff">Kwara State University</text>
    </g>
